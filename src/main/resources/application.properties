spring.application.name=tvmaze-middleware
server.port=8080
spring.profiles.active=local

# TV Maze API
tvmaze.api.base-url=https://api.tvmaze.com
tvmaze.api.timeout-seconds=5

# ---------------------------------------------------------------------------
# MongoDB Atlas / local
# Con perfil "local" se usa application-local.properties (URI Atlas, no se sube a Git).
# Sin perfil: MONGODB_URI o mongodb://localhost:27017/tvmaze_middleware
# ---------------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tvmaze_middleware}
spring.data.mongodb.database=tvmaze_middleware
spring.data.mongodb.auto-index-creation=true

# Caché de shows (TTL en días; 0 = no expira)
tvmaze.cache.ttl-days=7

# Máximo de comentarios por show en respuestas search/show
tvmaze.comments.max-per-show=100

# Logging
logging.level.com.example.maze.demo=INFO
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
